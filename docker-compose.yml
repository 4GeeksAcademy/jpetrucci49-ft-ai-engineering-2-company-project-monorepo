services:
  api:
    build:
      context: ./services
    volumes:
      - ./services/api:/app
      - ./data:/opt/healthcore/data
    environment:
      HEALTHCORE_REPO_ROOT: /opt/healthcore
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - healthcore

  # Separate process from Uvicorn. Sleeps until 02:05 UTC then runs
  # scripts/nightly_export.py. Host/dev alternative: deploy/nightly.crontab.
  nightly:
    build:
      context: ./services
    command: ["python", "/opt/healthcore/scripts/nightly_loop.py"]
    working_dir: /opt/healthcore
    volumes:
      - ./scripts:/opt/healthcore/scripts
      - ./data:/opt/healthcore/data
      - ./services/jobs:/opt/healthcore/services/jobs
      - ./services/api:/app
    environment:
      HEALTHCORE_REPO_ROOT: /opt/healthcore
      PYTHONPATH: /opt/healthcore:/opt/healthcore/services:/app
      TZ: UTC
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - healthcore

  ui:
    build:
      context: ./uis
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      - ./packages:/packages
      - ./src:/src
      - ./tests/utils:/tests/utils
      - website_node_modules:/app/website/node_modules
      - backoffice_node_modules:/app/backoffice/node_modules
      - website_next:/app/website/.next
      - backoffice_next:/app/backoffice/.next
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - healthcore

volumes:
  website_node_modules:
  backoffice_node_modules:
  website_next:
  backoffice_next:

networks:
  healthcore:
    name: healthcore
    driver: bridge

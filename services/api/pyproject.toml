[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore internal API — incident analysis and operations"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "libpass[bcrypt]>=1.9,<2",
    "pandas>=3.0.5",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.20",
    "resend>=2.0,<3",
    "tinydb>=4.8.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["models.py", "database.py", "seed.py", "routes", "app", "auth"]

[tool.uv]
package = true

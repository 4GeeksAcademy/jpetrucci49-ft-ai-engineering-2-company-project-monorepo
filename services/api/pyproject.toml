[project]
name = "healthcore-api"
version = "0.1.0"
description = "HealthCore internal API — incident analysis and operations"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "qdrant-client>=1.14.0",
    "libpass[bcrypt]>=1.9,<2",
    "pandas>=3.0.5",
    "prefect>=3,<4",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.20",
    "resend>=2.0,<3",
    "sqlmodel>=0.0.39",
    "tinydb>=4.8.2",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "seed_inventory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["models.py", "database.py", "incidents_database.py", "seed.py", "seed_inventory.py", "routes", "app", "auth", "inventory", "telemetry", "reporting", "knowledge"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "freezegun>=1.4",
    "httpx2>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"

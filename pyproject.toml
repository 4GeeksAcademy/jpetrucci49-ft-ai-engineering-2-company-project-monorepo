[project]
name = "healthcore"
version = "0.1.0"
description = "HealthCore monorepo — Python scripts for data analysis and automation"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "prefect>=3,<4",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2",
    "sqlmodel>=0.0.39",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/pipelines", "tests/jobs"]
pythonpath = ["."]

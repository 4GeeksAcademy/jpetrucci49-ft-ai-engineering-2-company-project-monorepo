[project]
name = "healthcore"
version = "0.1.0"
description = "HealthCore monorepo — Python scripts for data analysis and automation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "qdrant-client>=1.14.0",
    "prefect>=3,<4",
    "psycopg[binary]>=3.3.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "sqlmodel>=0.0.39",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
    "langgraph>=1.2.12",
    "mcpauth>=0.2.0b1",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "tinydb>=4.9.0",
    "markitdown[pdf]>=0.1.8",
    "py-readability-metrics>=1.4.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/pipelines", "tests/jobs"]
pythonpath = [".", "services/api"]
